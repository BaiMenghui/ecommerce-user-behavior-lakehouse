# ============================================================
# 阶段0 归档：环境编排文件 docker-compose.yml
# 项目：电商用户行为湖仓分析平台
# 归档日期：2026-10-22（按实际部署拓扑整理，与阶段0汇报 2.2 节容器清单一致）
#
# 实际环境拓扑说明：
#   - 容器侧：仅 2 个容器 —— postgres-metastore(元数据库) + hive-metastore(元数据服务)
#   - 计算侧：Spark 3.3.0 以 pip PySpark 本地模式运行于 WSL2(Ubuntu)，非容器
#             Hudi 0.14.1 通过 hudi-spark3.3-bundle_2.12-0.14.1.jar 集成
#   - 存储：  本地文件系统 ~/hudi-bigdata/warehouse（非 HDFS），表目录按层存放
#             （ods/ dim/ dwd/ ads/）
#   - 网络：  bigdata-net (bridge)，启动前需已存在：
#             docker network create bigdata-net
#
# 使用：
#   docker compose up -d          # 启动元数据库与 Metastore
#   docker compose ps             # 查看状态
#   docker compose down           # 停止（保留数据卷）
# ============================================================

version: "3.8"

services:
  # ---------- Hive Metastore 元数据库 ----------
  postgres-metastore:
    image: postgres:14
    container_name: postgres-metastore
    restart: unless-stopped
    networks:
      - bigdata-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    volumes:
      - metastore-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Hive Metastore 服务（Thrift 9083） ----------
  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    restart: unless-stopped
    networks:
      - bigdata-net
    depends_on:
      postgres-metastore:
        condition: service_healthy
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      # 连接外部 Postgres 元数据库（服务名通过 bigdata-net 解析）
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres-metastore:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive

# ---------- 网络（外部已创建，复用不重复建） ----------
networks:
  bigdata-net:
    external: true

# ---------- 数据卷：元数据库持久化，down 后重建容器数据不丢 ----------
volumes:
  metastore-data:
